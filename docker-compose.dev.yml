services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artha-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - artha-net
    # Install devDependencies at runtime so nodemon works for live reloading
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artha-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_API_ORIGIN=http://localhost:5000
      - VITE_APP_URL=http://localhost:5173
      - VITE_AUTH_SERVER_URL=https://bhiv-auth.onrender.com
      - VITE_AUTH_MESSAGE_ORIGIN=https://bhiv-auth.onrender.com
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - artha-net
    depends_on:
      - backend

networks:
  artha-net:
    driver: bridge
