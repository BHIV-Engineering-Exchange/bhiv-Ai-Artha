services:
  backend:
    image: bhiv/artha-backend:IMG_TAG
    container_name: artha-backend-prod
    restart: always
    ports:
      - "5002:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      HMAC_SECRET: ${HMAC_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    env_file:
      - .env
    volumes:
      - artha-uploads:/app/uploads
      - artha-logs:/app/logs
    networks:
      - artha-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: bhiv/artha-frontend:IMG_TAG
    container_name: artha-frontend-prod
    restart: always
    ports:
      - "5175:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - artha-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  artha-uploads:
    driver: local
  artha-logs:
    driver: local

networks:
  artha-network:
    driver: bridge
